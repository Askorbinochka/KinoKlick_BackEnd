services:
  - type: web
    name: cinoclick-api
    env: node
    plan: free
    buildCommand: npm install && npm run render-build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
